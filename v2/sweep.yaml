# W&B 하이퍼파라미터 스윕 v2 — 1차 스윕(zioho1fl, 완주 4런) 결과로 범위 축소 (2026-08-11)
#   근거: lr 1.2e-4~1.8e-4 런들이 1e-6대를 압도(73/76 vs 90/91 kcal) → lr을 그 주변 2자릿수로.
#   atten/inner 64는 상위권에 없음 → 제외. heads=12는 atten_dim 후보와 배수가 안 맞아 전부
#   bail이었음 → 제외(1차 수율 20%의 주범 하나). lambda_F는 신호가 약해 완만히 축소.
# 실행: wandb sweep v2/sweep.yaml && wandb agent <sweep-id>
#
# 불가능 조합(number_propo>=heads 등)과 NaN 발산 런은 train_wandb.py가 최악 점수(1e9)를
# 기록하고 즉시 종료해 Bayes가 그 영역을 피하게 한다.
# lambda_F는 스윕하지 않는다(2026-08-13): MACE 표준 1:100 고정. 스윕 지표가 에너지 MAE뿐이라
# λ_F를 탐색 축에 두면 힘을 희생해 에너지만 맞추는 쪽으로 최적화가 게임됨.
program: v2/train_wandb.py
method: bayes
metric: { name: val/E_MAE_kcal, goal: minimize }
early_terminate: { type: hyperband, min_iter: 8 }
parameters:
  lr:           { distribution: log_uniform_values, min: 2e-5, max: 1e-3 }
  batch:        { values: [32, 64, 128] }
  atten_dim:    { values: [128, 256] }
  inner_dim:    { values: [128, 192] }
  atten_heads:  { values: [4, 8, 16] }
  number_propo: { values: [1, 2, 4] }
  ref:          { values: ["fit", "nist"] }  # 기준 에너지 A/B: 최소제곱 vs 고립원자(NIST LSD)
