# W&B 하이퍼파라미터 스윕 (SimpleModel, QM9x train split 기준)
# 실행: wandb sweep v2/sweep.yaml && wandb agent <sweep-id>
#
# 불가능 조합(나눗셈·propo 제약 위반)은 train_wandb.py가 최악 점수(1e9)를 기록하고
# 즉시 종료해 Bayes가 그 영역을 피하게 한다. NaN 발산 런도 동일 처리.
program: v2/train_wandb.py
method: bayes
metric: { name: val/E_MAE_kcal, goal: minimize }
early_terminate: { type: hyperband, min_iter: 8 }
parameters:
  lr:           { distribution: log_uniform_values, min: 1e-6, max: 0.1 }
  batch:        { values: [32, 64, 128] }
  atten_dim:    { values: [64, 128, 256, 512] }
  inner_dim:    { values: [64, 128, 192, 256] }
  atten_heads:  { values: [4, 8, 12, 16] }
  number_propo: { values: [1, 2, 4] }
  lambda_F:     { distribution: log_uniform_values, min: 0.1, max: 100 }
